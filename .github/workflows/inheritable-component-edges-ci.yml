name: Blueprint inherited-component graph edges CI
on:
  push:
    branches: [research/66-inheritable-component-record-edges]
  pull_request:
permissions:
  contents: read
jobs:
  exact-source-records:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s test -p 'test_inheritable_component_edges.py' -v
      - run: python3 -m unittest discover -s test -p 'test_audit_blueprint_reference_surface.py' -v
      - run: python3 -m unittest discover -s test -p 'test_blueprint_graph_index.py' -v
