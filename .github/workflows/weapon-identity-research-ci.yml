name: Weapon identity candidate checks (offline)

on:
  push:
    branches: [research/51-destroyer-mg-identity]
    paths:
      - 'data_manual/weapon_asset_identity_candidates.json'
      - 'scripts/validate_weapon_identity_candidates.py'
      - 'test/test_weapon_identity_candidates.py'
      - 'scripts/report_weapon_identity_coverage.py'
      - 'test/test_weapon_identity_coverage.py'
      - 'scripts/resolve_blueprint_weapons.py'
      - 'test/test_resolve_blueprint_weapons.py'
      - 'scripts/resolve_infantry_weapons.py'
      - 'test/test_resolve_infantry_weapons.py'
      - '.github/workflows/weapon-identity-research-ci.yml'
  pull_request:
    paths:
      - 'data_manual/weapon_asset_identity_candidates.json'
      - 'scripts/validate_weapon_identity_candidates.py'
      - 'test/test_weapon_identity_candidates.py'
      - '.github/workflows/weapon-identity-research-ci.yml'

permissions:
  contents: read

jobs:
  identity-research-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate candidate ledger and synthetic mount row checks
        run: python3 -m unittest discover -s test -p 'test_weapon_identity_candidates.py' -v
      - name: Test conservative identity coverage inventory
        run: python3 -m unittest discover -s test -p 'test_weapon_identity_coverage.py' -v
      - name: Smoke-test inventory against current committed weapon sheets
        run: python3 scripts/report_weapon_identity_coverage.py --output /tmp/weapon-identity-coverage.json
      - name: Test Blueprint weapon resolver (synthetic exports)
        run: python3 -m unittest discover -s test -p 'test_resolve_blueprint_weapons.py' -v
      - name: Test infantry pickup and compatible-ammo resolver
        run: python3 -m unittest discover -s test -p 'test_resolve_infantry_weapons.py' -v
      - name: Validate reference tracing tests
        run: python3 -m unittest discover -s test -p 'test_trace_weapon_assets.py' -v
