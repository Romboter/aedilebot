name: Issue 22 - Python baseline and TypeScript parity

on:
  push:
    branches:
      - fix/22-reconcile-python-main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies for reference fixtures
        run: |
          python -m pip install --upgrade pip
          python -m pip install "discord.py>=2.4,<3" "fuzzywuzzy==0.18.0" "python-Levenshtein>=0.25,<1" "inflect==7.6.0" "python-dotenv>=1,<2"
      - name: Regenerate reference fixtures from merged Python main
        run: python scripts/generate_fixtures.py
      - name: Preserve generated Python fixtures in the review branch
        run: |
          git add test/fixtures/
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh golden fixtures from merged Python main (#22) [skip ci]'
            git push origin HEAD:fix/22-reconcile-python-main
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: bot-ts/package-lock.json
      - name: Install TypeScript dependencies
        working-directory: bot-ts
        run: npm ci
      - name: Typecheck
        working-directory: bot-ts
        run: npm run typecheck
      - name: Run TypeScript regression suite
        working-directory: bot-ts
        run: npm test
      - name: Build
        working-directory: bot-ts
        run: npm run build
