name: CUE4Parse extractor - offline Linux build

on:
  push:
    branches: [feat/45-linux-cue4parse-submodule]
    paths:
      - '.github/workflows/cue4parse-extractor-ci.yml'
      - '.gitmodules'
      - 'tools/cue4parse-extractor/**'
      - 'tools/vendor/CUE4Parse'
  pull_request:
    branches: [rewrite/node-ts]
    paths:
      - '.github/workflows/cue4parse-extractor-ci.yml'
      - '.gitmodules'
      - 'tools/cue4parse-extractor/**'
      - 'tools/vendor/CUE4Parse'

permissions:
  contents: read

jobs:
  build:
    name: Compile Linux extractor without game assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pinned submodule
        uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false

      - name: Verify dependency pin
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C tools/vendor/CUE4Parse rev-parse HEAD)" = "85495b5e126203d68ae3bf84e37fe31abd56a0e5"
          test -f tools/vendor/CUE4Parse/CUE4Parse/CUE4Parse.csproj

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compile without Steam credentials or game PAKs
        run: |
          dotnet build tools/cue4parse-extractor/Extractor.csproj \
            -c Release --nologo -clp:ErrorsOnly -p:NuGetAudit=false
          test -f tools/cue4parse-extractor/bin/Release/net10.0/Extractor.dll
