name: Foxhole SteamCMD map extraction

on:
  push:
    branches: [feat/38-steamcmd-map-export]
    paths:
      - 'tools/map-extraction/**'
      - '.github/workflows/foxhole-map-extract.yml'
  pull_request:
    branches: [rewrite/node-ts]
    paths:
      - 'tools/map-extraction/**'
      - '.github/workflows/foxhole-map-extract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foxhole-map-export
  cancel-in-progress: false

jobs:
  validate:
    name: Validate map inventory parser (no game download)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inventory unit tests
        run: python -m unittest discover -s tools/map-extraction -p 'test_*.py' -v
      - name: Linux runner script syntax check
        shell: bash
        run: bash -n tools/map-extraction/steam_export.sh
      - name: PowerShell extraction script syntax check
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('tools/map-extraction/Invoke-SteamExport.ps1', [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }

  linux_exporter_build:
    name: Verify pinned exporter runs natively on Linux (no game files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Checkout pinned CUE4Parse exporter
        run: |
          git clone https://github.com/Tsekho/fh_map_exporter.git /tmp/fh-map-exporter
          git -C /tmp/fh-map-exporter checkout --detach db11ab571a6c95fb63c53d7c3bdec44d9f7966d1
          git -C /tmp/fh-map-exporter submodule update --init --recursive
          test "$(git -C /tmp/fh-map-exporter rev-parse HEAD)" = "db11ab571a6c95fb63c53d7c3bdec44d9f7966d1"
      - name: Publish Linux x64 exporter
        run: |
          dotnet publish /tmp/fh-map-exporter/Exporter/Exporter.csproj -c Release -r linux-x64 --self-contained true -o /tmp/fh-exporter-bin -p:RuntimeIdentifier=linux-x64 -p:NuGetAudit=false
          test -x /tmp/fh-exporter-bin/Exporter
      - name: Smoke-test Linux binary command-line interface
        run: |
          set +e
          output=$(/tmp/fh-exporter-bin/Exporter -i /definitely/no/pak -o /tmp/foo 2>&1)
          code=$?
          set -e
          echo "$output"
          test "$code" -ne 0
          echo "$output" | grep -qi 'pak path does not exist'

  extract:
    name: SteamCMD download + native Linux CUE4Parse export
    if: github.event_name == 'workflow_dispatch'
    needs: [validate, linux_exporter_build]
    runs-on: [self-hosted, linux, x64, foxhole-extract]
    timeout-minutes: 240
    environment: foxhole-extraction
    env:
      FOXHOLE_WORK_ROOT: ${{ vars.FOXHOLE_WORK_ROOT }}
      FOXHOLE_STEAMCMD_PATH: ${{ vars.FOXHOLE_STEAMCMD_PATH }}
      FOXHOLE_STEAM_USER: ${{ vars.FOXHOLE_STEAM_USER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Download Foxhole Windows depot and export map JSON on Ubuntu
        shell: bash
        run: bash tools/map-extraction/steam_export.sh
      - name: Upload diagnostic inventory only (not game PAK or raw map JSON)
        uses: actions/upload-artifact@v4
        with:
          name: foxhole-map-inventory-${{ github.run_id }}
          path: |
            ${{ vars.FOXHOLE_WORK_ROOT }}/outputs/map-inventory.json
            ${{ vars.FOXHOLE_WORK_ROOT }}/outputs/map-inventory.csv
          if-no-files-found: error
          retention-days: 30
