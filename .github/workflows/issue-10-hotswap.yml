name: Issue 10 - hot-swap module graph

on:
  push:
    branches:
      - fix/10-hotswap-dependency-graph
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot-ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bot-ts/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify compiled real calculator and fuzzy plugins can swap and roll back
        run: |
          node --input-type=module <<'NODE'
          import { resolve } from "node:path";
          import { PluginHost } from "./dist/plugins/pluginHost.js";
          import calculator from "./dist/domain/calculator/plugin.js";
          import fuzzy from "./dist/domain/fuzzy/plugin.js";
          for (const [plugin, relativePath] of [
            [calculator, "dist/domain/calculator/plugin.js"],
            [fuzzy, "dist/domain/fuzzy/plugin.js"],
          ]) {
            const path = resolve(relativePath);
            const host = new PluginHost(plugin, path, 5, "isolated-dist");
            const result = await host.swap(path);
            if (!result.ok) throw result.error;
            if (!host.get()) throw new Error(relativePath + " is missing its API");
            const rollback = host.rollback();
            if (!rollback.ok) throw rollback.error;
            console.log("PASS", relativePath, "including validation and rollback");
          }
          NODE
