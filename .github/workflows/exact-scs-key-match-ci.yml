name: Exact serialized SCS component-key CI
on:
  push:
    branches: [research/70-exact-scs-component-key-match]
  pull_request:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s test -p 'test_resolve_scs_component_keys.py' -v
      - run: python3 -m unittest discover -s test -p 'test_audit_scs_component_keys.py' -v
      - run: python3 -m unittest discover -s test -p 'test_pair_inheritable_component_records.py' -v
